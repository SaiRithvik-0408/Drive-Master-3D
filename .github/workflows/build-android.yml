name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Distribution
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Drive-Master-3D.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drive-Master-3D-APK
          path: Drive-Master-3D.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "Drive Master 3D v1.0.0 (APK)"
          body: |
            ## Drive Master 3D - Android APK Download 🚗💨
            
            Download `Drive-Master-3D.apk` directly to your Android device to install and play!
            
            ### How to Install on Android:
            1. Download `Drive-Master-3D.apk` below.
            2. Tap the file in your notification or Downloads folder.
            3. If prompted, allow "Install unknown apps" for your browser/file manager.
            4. Open **Drive Master 3D** and start driving!
          files: Drive-Master-3D.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
