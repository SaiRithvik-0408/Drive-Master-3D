name: Build Android APK and Play Store AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build APK and AAB with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Upload Debug APK (For Testing)
        uses: actions/upload-artifact@v4
        with:
          name: drive-master-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play Store AAB (For Google Play Store Release)
        uses: actions/upload-artifact@v4
        with:
          name: drive-master-playstore-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
